<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pounds ↔ Kilograms Converter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>Pounds ↔ Kilograms</h1>

    <label class="field">
      <span class="label">Pounds (lb)</span>
      <input id="pounds" type="number" inputmode="decimal" placeholder="e.g. 150" aria-label="pounds input">
    </label>

    <label class="field">
      <span class="label">Kilograms (kg)</span>
      <input id="kilograms" type="number" inputmode="decimal" placeholder="e.g. 68.04" aria-label="kilograms input">
    </label>

    <div class="note">Type a value in either field — conversion happens live.</div>
    <footer class="attribution">Lightweight static page • no tracking</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
